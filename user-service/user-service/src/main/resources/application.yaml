spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

# JWT configuration
jwt:
  secret: openssl rand -base64 32
  expiration: 3600000          # 1 hour in ms
  refresh-expiration: 86400000 # 24 hours in ms

# AWS configuration
aws:
  access-key: start with AKI
  secret-key: start with  WRp
  region: eu-north-1
  s3:
    bucket-name: linkdin-app-566540245638-eu-north-1-an 

# Actuator management endpoints
management:
  endpoints:
    web:
      exposure:
        include:
             - info
             - health
        
