spring:
  application:
    name: post-service

  datasource:
    url: jdbc:mysql://localhost:3306/post_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082
 
# AWS configuration
aws:
  access-key: Your access key (start with : AKIAKDFSKFJSD)
  secret-key: your secrete key(start with :WR)
  region: eu-north-1
  s3:
    bucket-name: your see like this ##linkdin-app-234243434334-eu-north-1-an

# Actuator management endpoints
management:
  endpoints:
    web:
      exposure:
        include:
           - health
           - info
